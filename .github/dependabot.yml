version: 2
updates:
  # UIPackage / InfraPackage（SPM）の直接依存のみを監視する。LocalPackageは外部依存を持たない。
  # ProjectTools / DangerTools / homete.xcodeproj は対象外。
  - package-ecosystem: "swift"
    directories:
      - "/UIPackage"
      - "/InfraPackage"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    # 推移的依存（Firebase SDKが内部で引くgRPC等）のPRは作らない
    allow:
      - dependency-type: "direct"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
