name: Deploy Functions

# E2Eテストの成功を前提にデプロイしたいため、pushではなく
# Firebase Functions E2E Test の完了を受けて発火する。
# 発火元がpathsで firebase/functions/** に絞られているので、
# このワークフロー側でpathsを指定しなくても対象変更時のみ動く。
#
# 自動発火（workflow_run）は必ずSTG。本番は workflow_dispatch で
# environment=prod を明示的に選んだときだけデプロイする。
on:
  workflow_run:
    workflows: ["Firebase Functions E2E Test"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ先のFirebaseプロジェクト（.firebasercのエイリアス）"
        type: choice
        options:
          - stg
          - prod
        default: stg

# デプロイ同士が並走すると Cloud Functions 側で競合するため直列化する。
# STGと本番は別プロジェクトなので互いにブロックしないよう環境ごとに分ける。
concurrency:
  group: deploy-functions-${{ inputs.environment || 'stg' }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  FUNCTIONS_DIR: firebase/functions
  # workflow_run から来た場合 inputs は空なのでSTGにフォールバックする
  DEPLOY_ENV: ${{ inputs.environment || 'stg' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_dispatch（手動実行）か、mainへのpushで走ったE2Eが成功したときだけデプロイする。
    # PR上のE2E成功で走らないよう event と head_branch も見る。
    # workflow_dispatchは任意のrefから実行できてしまうため、mainブランチ実行時のみ許可する
    # （mainはfunctions-e2e-test.ymlでpushの度にE2E検証されている前提）
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      # workflow_run はデフォルトブランチのHEADをチェックアウトするため、
      # 実際にテストが通ったコミットを明示的に指定する
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.FUNCTIONS_DIR }}/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # firebase.json の predeploy が npm run lint / build を実行するため、
      # デプロイ前に functions 配下の依存を入れておく必要がある
      - name: Install dependencies
        working-directory: ${{ env.FUNCTIONS_DIR }}
        run: npm ci

      # 環境ごとに別のサービスアカウントを使う。secrets名は動的に組み立てられないため、
      # 両方をenvに載せてシェル側で選ぶ（未選択側は使わずに捨てられる）
      - name: Write Service Account JSON
        env:
          SERVICE_ACCOUNT_STG: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SERVICE_ACCOUNT_PROD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
        run: |
          if [ "$DEPLOY_ENV" = "prod" ]; then
            SERVICE_ACCOUNT="$SERVICE_ACCOUNT_PROD"
            SECRET_NAME="FIREBASE_SERVICE_ACCOUNT_PROD"
          else
            SERVICE_ACCOUNT="$SERVICE_ACCOUNT_STG"
            SECRET_NAME="FIREBASE_SERVICE_ACCOUNT"
          fi
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::$SECRET_NAME secret is not set"
            exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT" > /tmp/service-account.json

      # --project を明示し、.firebaserc の default（現在は未定義）に暗黙依存しない
      - name: Deploy Functions
        run: firebase deploy --only functions --project "$DEPLOY_ENV" --non-interactive
        working-directory: firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json

      - name: Create deploy summary
        if: always()
        run: |
          {
            echo "## Deploy Functions"
            echo ""
            echo "- **Environment**: \`$DEPLOY_ENV\`"
            echo "- **Result**: ${{ job.status }}"
            echo "- **Commit**: \`${{ github.event.workflow_run.head_sha || github.sha }}\`"
            echo "- **Triggered by**: ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
