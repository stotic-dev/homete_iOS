name: Deploy Firestore

on:
  push:
    branches:
      - main
    paths:
      - 'firebase/firestore.indexes.json'
      - 'firebase/firestore.rules'
  workflow_dispatch:

jobs:
  deploy-firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write Service Account JSON
        run: |
          if [ -z '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set"
            exit 1
          fi
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/service-account.json

      # ルールを配らないとInvitationの読み書き制限がプロジェクトに反映されないため、
      # indexesと同じタイミングでrulesも配る
      - name: Deploy Firestore Rules and Indexes
        run: firebase deploy --only firestore:rules,firestore:indexes --non-interactive
        working-directory: firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json
