name: Deploy Hosting

# Hostingは静的ファイル（AASA・招待リンクのフォールバックページ）のみのため、
# ビルドやテストを挟まずデプロイする。
# mainへのpushで反映されるのはSTGのみ。本番は workflow_dispatch で
# environment=prod を明示的に選んだときだけデプロイする。
on:
  push:
    branches:
      - main
    paths:
      - "firebase/hosting/**"
      - "firebase/firebase.json"
      - ".github/workflows/deploy-hosting.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ先のFirebaseプロジェクト（.firebasercのエイリアス）"
        type: choice
        options:
          - stg
          - prod
        default: stg

# デプロイ同士が並走しないよう直列化する。STGと本番は別プロジェクトなので
# 互いにブロックしないよう環境ごとに分ける。
concurrency:
  group: deploy-hosting-${{ inputs.environment || 'stg' }}
  cancel-in-progress: false

env:
  # push から来た場合 inputs は空なのでSTGにフォールバックする
  DEPLOY_ENV: ${{ inputs.environment || 'stg' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 環境ごとに別のサービスアカウントを使う。secrets名は動的に組み立てられないため、
      # 両方をenvに載せてシェル側で選ぶ（未選択側は使わずに捨てられる）
      - name: Write Service Account JSON
        env:
          SERVICE_ACCOUNT_STG: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SERVICE_ACCOUNT_PROD: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
        run: |
          if [ "$DEPLOY_ENV" = "prod" ]; then
            SERVICE_ACCOUNT="$SERVICE_ACCOUNT_PROD"
            SECRET_NAME="FIREBASE_SERVICE_ACCOUNT_PROD"
          else
            SERVICE_ACCOUNT="$SERVICE_ACCOUNT_STG"
            SECRET_NAME="FIREBASE_SERVICE_ACCOUNT"
          fi
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::$SECRET_NAME secret is not set"
            exit 1
          fi
          printf '%s' "$SERVICE_ACCOUNT" > /tmp/service-account.json

      # --project を明示し、.firebaserc の default（現在は未定義）に暗黙依存しない
      - name: Deploy Hosting
        run: firebase deploy --only hosting --project "$DEPLOY_ENV" --non-interactive
        working-directory: firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/service-account.json

      - name: Create deploy summary
        if: always()
        run: |
          {
            echo "## Deploy Hosting"
            echo ""
            echo "- **Environment**: \`$DEPLOY_ENV\`"
            echo "- **Result**: ${{ job.status }}"
            echo "- **Commit**: \`${{ github.sha }}\`"
            echo "- **Triggered by**: ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
