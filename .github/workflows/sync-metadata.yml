name: Sync Metadata

# doc/adr/0016: release-merged.yml からのGitHub Release publish後にキックされる。
# fastlane/metadata配下のテキストメタデータをApp Store Connectへ同期する
# （fastlane sync_metadataレーン、Fastfile参照）。ビルドのアップロードは行わない。
# 単独での再実行やスクリーンショット追加後の確認用に workflow_dispatch でも起動できる。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "同期対象のバージョン（ログ表示用、省略可）"
        required: false
  workflow_call:
    inputs:
      version:
        description: "同期対象のバージョン（ログ表示用、省略可）"
        required: false
        type: string

jobs:
  sync-metadata:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Select Xcode version
        run: sudo xcode-select -s '${{ env.DEVELOPER_DIR }}/Contents/Developer'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          echo "$ASC_API_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/asc_api_key.p8"
          echo "ASC_API_KEY_PATH=$RUNNER_TEMP/asc_api_key.p8" >> "$GITHUB_ENV"

      - name: Sync metadata to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bundle exec fastlane sync_metadata

      - name: Create summary
        if: always()
        run: |
          {
            echo "## Sync Metadata"
            echo ""
            echo "- **Version**: \`${{ inputs.version || 'N/A' }}\`"
            echo "- **Result**: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
