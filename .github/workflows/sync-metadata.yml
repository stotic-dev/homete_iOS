name: Sync Metadata

# doc/adr/0016: fastlane/metadata配下のテキストメタデータをApp Store Connectへ同期する
# （fastlane sync_metadataレーン、Fastfile参照）。ビルドのアップロードは行わない。
# versionはASC上のバージョン作成にも使うため必須。対象バージョンがASCに無ければ新規作成し、
# 既にあればメタデータの更新のみ行う（Fastfileのsync_metadataレーン参照）。
# fastlane/creative_assets配下のクリエイティブアセット（プロダクトページヘッダー・検索結果）は
# deliverが対応していないため、メタデータの同期後にASC APIを直接叩いて配置する（doc/adr/0045）。
# fastlane/app_previews配下のアプリプレビュー（動画）も同じくdeliverが対応していないため、
# ASC APIを直接叩いてアップロードする（doc/adr/0050）。
# release-merged.yml（PRマージ時）からは起動しない（doc/adr/0027）。
# リリースPRのブランチ（release/*）にメタデータ・スクリーンショットの変更がpushされたときは
# 自動で同期する（doc/adr/0032）。それ以外は workflow_dispatch で手動実行する。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "同期・作成対象のバージョン番号（例: 1.1.0。先頭のvは省略可）"
        required: true
  workflow_call:
    inputs:
      version:
        description: "同期・作成対象のバージョン番号（例: v1.1.0。先頭のvは省略可）"
        required: true
        type: string
  push:
    branches:
      - "release/**"
    paths:
      - "fastlane/metadata/**"
      - "fastlane/screenshots/**"
      - "fastlane/creative_assets/**"
      - "fastlane/app_previews/**"

# 同じリリースブランチへ連続でpushされても deliver が並走しないよう直列化する。
# 実行中のものはキャンセルしない（ASCへの反映途中で止めないため）。
concurrency:
  group: sync-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-metadata:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app
      # pushトリガーではinputsが無いので、ブランチ名（release/v1.1.0）からバージョンを解決する
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Select Xcode version
        run: sudo xcode-select -s '${{ env.DEVELOPER_DIR }}/Contents/Developer'

      - name: Normalize version
        run: |
          NORMALIZED_VERSION="${VERSION#release/}"
          NORMALIZED_VERSION="${NORMALIZED_VERSION#v}"
          if ! [[ "$NORMALIZED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version は X.Y.Z（先頭のvは省略可）形式で指定してください（入力: $VERSION）"
            exit 1
          fi
          echo "NORMALIZED_VERSION=$NORMALIZED_VERSION" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Write App Store Connect API key
        env:
          ASC_SECRET_KEY: ${{ secrets.ASC_SECRET_KEY }}
        run: |
          echo "$ASC_SECRET_KEY" | base64 -d > "$RUNNER_TEMP/asc_api_key.p8"
          if [ ! -s "$RUNNER_TEMP/asc_api_key.p8" ]; then
            echo "::error::ASC_SECRET_KEY のデコード結果が空でした。シークレットの設定値を確認してください"
            exit 1
          fi
          echo "ASC_API_KEY_PATH=$RUNNER_TEMP/asc_api_key.p8" >> "$GITHUB_ENV"

      - name: Sync metadata to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bundle exec fastlane sync_metadata app_version:"$NORMALIZED_VERSION"

      # deliverの後に流す。対象バージョンが無い場合はsync_metadataが作成するため
      - name: Sync creative assets to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: scripts/appstoreconnect.sh creative-assets sync "$NORMALIZED_VERSION" fastlane/creative_assets

      # deliverの後に流す。対象バージョンが無い場合はsync_metadataが作成するため
      - name: Sync app previews to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: scripts/appstoreconnect.sh app-previews sync "$NORMALIZED_VERSION" fastlane/app_previews

      - name: Create summary
        if: always()
        run: |
          {
            echo "## Sync Metadata"
            echo ""
            echo "- **Version**: \`$NORMALIZED_VERSION\`"
            echo "- **Trigger**: ${{ github.event_name }}"
            echo "- **Result**: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
